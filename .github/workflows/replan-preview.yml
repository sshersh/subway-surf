name: Re-plan preview (results to a branch)

# Runs the re-planner on the current MTA alerts and commits the outputs to the replan-results branch,
# without deploying the site (Pages only deploys from main).
on:
  push:
    branches: [replan-around-alerts]
    paths: [".github/workflows/replan-preview.yml", "solver/replan.py", "status/alerts.py"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FEED: https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/camsys%2Fsubway-alerts.json

jobs:
  replan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: curl -fsS --retry 3 --max-time 60 -A "subway-surf-status/1.0" -o alerts.json "$FEED"
      - name: Banner check and service changes
        run: |
          mkdir -p out
          python3 status/check_status.py --feed alerts.json --out out/status.json
          python3 status/check_status.py --feed alerts.json --route results/best_route_express.json --out out/status_express.json || true
          python3 status/alerts.py --feed alerts.json --out out/changes.json
      - name: GTFS and dependencies
        run: |
          npm pack mta-gtfs-static --silent
          mkdir -p gtfs && tar xzf mta-gtfs-static-*.tgz -C gtfs
          python3 -c "import zipfile; zipfile.ZipFile('gtfs/package/gtfs_json.zip').extractall('gtfs')"
          pip install -r requirements.txt
      - name: Re-plan
        run: |
          python3 solver/replan.py --gtfs gtfs/gtfs_json/subway --changes out/changes.json --out replan --minutes 8 --procs 2 2>&1 | tee out/replan.log
          cp replan/*.json out/ || true
      - name: Commit to replan-results
        if: always()
        run: |
          cd out && ls -la
          git init -q -b replan-results && git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Re-plan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" replan-results

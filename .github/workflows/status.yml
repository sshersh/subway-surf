name: Plan for current service and deploy

# Every 15 minutes: pull the MTA subway alerts, turn skipped stops, suspensions and closures into
# changes to the timetable, plan the route on that timetable, and deploy the site with it.
#
# Planning only runs when the modeled service changes differ from the last solved set (same hash ->
# the cached plan is reused). When they differ, the last plan is checked first: if the new changes
# don't touch it, it's kept as is; if they do, only the part from shortly before the first affected
# ride is re-solved (alongside an unrestricted run), and runs stop once they stop improving.
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main, replan-around-alerts]
  workflow_dispatch:
    inputs:
      force:
        description: "Plan again even if the service changes haven't changed"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FEED: https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/camsys%2Fsubway-alerts.json
  PLAN_MINUTES: "10"   # hard cap on annealing time; local and express run side by side
  PLAN_ITERS: "600000" # annealing moves per run; runs also stop early once they stop improving
  PLAN_PROCS: "2"      # parallel annealing runs per rules (runners have 4 cores on public repos)
  MERGE_472: "1"       # the official 472-station count (solver/stations472.py)

jobs:
  # Planning has its own queue, so a deploy elsewhere in the "pages" group can't cancel it mid-solve.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: plan-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Fetch MTA alerts
        id: feed
        run: |
          if curl -fsS --retry 3 --max-time 60 -A "subway-surf-status/1.0" -o alerts.json "$FEED"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Work out service changes
        id: changes
        if: steps.feed.outputs.ok == 'true'
        run: |
          python3 status/alerts.py --feed alerts.json --out changes.json
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json; c = json.load(open("changes.json"))
          print(f"hash={c['hash']}"); print(f"count={len(c['changes'])}")
          EOF

      - name: Restore the plan for these changes
        id: cache
        if: steps.feed.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: plan
          key: plan-v6-${{ steps.changes.outputs.hash }}
          restore-keys: |
            plan-v6-
            plan-v5-
            plan-v4-
            plan-v3-

      - name: Get the GTFS timetable
        if: steps.feed.outputs.ok == 'true' && (steps.cache.outputs.cache-hit != 'true' || inputs.force)
        run: |
          npm pack mta-gtfs-static --silent
          mkdir -p gtfs && tar xzf mta-gtfs-static-*.tgz -C gtfs
          python3 -c "import zipfile; zipfile.ZipFile('gtfs/package/gtfs_json.zip').extractall('gtfs')"
          pip install -r requirements.txt

      - name: Plan the route on the changed timetable
        id: plan
        if: steps.feed.outputs.ok == 'true' && (steps.cache.outputs.cache-hit != 'true' || inputs.force)
        continue-on-error: true
        run: |
          python3 solver/plan.py --gtfs gtfs/gtfs_json/subway --changes changes.json --out plan_new \
            --prev plan --local-transfers mta --minutes "$PLAN_MINUTES" --procs "$PLAN_PROCS" --iters "$PLAN_ITERS" ${{ inputs.force && '--resolve' || '' }}
          rm -rf plan && mv plan_new plan

      - name: Save the plan
        if: steps.plan.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: plan
          key: plan-v6-${{ steps.changes.outputs.hash }}
        continue-on-error: true   # a forced plan can't overwrite an existing cache entry

      - name: Fall back to the saved routes
        if: steps.feed.outputs.ok != 'true' || steps.plan.outcome == 'failure' || (steps.cache.outputs.cache-hit != 'true' && steps.plan.outcome != 'success')
        run: |
          python3 - <<'EOF'
          import json, os, shutil, time
          why = ("Couldn't read the MTA alerts" if not os.path.exists("changes.json")
                 else "Planning on the changed timetable failed")
          c = json.load(open("changes.json")) if os.path.exists("changes.json") else {}
          shutil.rmtree("plan", ignore_errors=True); os.makedirs("plan")
          shutil.copy("results/best_route.json", "plan/route.json")
          shutil.copy("results/best_route_express.json", "plan/route_express.json")
          json.dump({"run_date": c.get("run_date"), "hash": c.get("hash"), "solved_at": int(time.time()),
                     "changes": c.get("changes", []), "not_modeled": c.get("not_modeled", []), "dropped": [], "rules": {},
                     "error": why + ", so this is the route for normal service."}, open("plan/plan.json", "w"), indent=1)
          EOF

      - name: Check remaining alerts against the planned route (banner)
        run: |
          mkdir -p _site/viewer
          unknown='import json,time,sys; json.dump({"checked_at":int(time.time()),"verdict":"unknown","now":[],"next_run":{"issues":[]}},open(sys.argv[1],"w"))'
          if [ "${{ steps.feed.outputs.ok }}" = "true" ]; then
            python3 status/check_status.py --feed alerts.json --route plan/route.json --out _site/status.json || python3 -c "$unknown" _site/status.json
            python3 status/check_status.py --feed alerts.json --route plan/route_express.json --out _site/status_express.json || true
          else
            python3 -c "$unknown" _site/status.json
          fi

      - name: Build the site with the planned routes
        run: |
          python3 viewer/build.py viewer/data.json plan/route.json _site/index.html plan/route_express.json --plan plan/plan.json
          cp _site/index.html _site/viewer/index.html
          cp plan/plan.json _site/ && cp plan/plan.json _site/viewer/
          [ -f _site/status_express.json ] && cp _site/status_express.json _site/viewer/
          cp _site/status.json _site/viewer/status.json
          touch _site/.nojekyll
          python3 -c "import json; d=json.load(open('plan/plan.json')); print('plan for', d['run_date'], {k: v.get('total_s') for k, v in d['rules'].items()}, d.get('error', ''))"
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

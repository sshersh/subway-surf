name: Fetch realtime sample days

# Copies two days of subwaydata.nyc archives to the data-sample branch so they can be inspected offline.
on:
  push:
    branches: [headway-model]
    paths: [".github/workflows/fetch-sample.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d && cd d
          for day in 2026-10-07 2026-10-08; do
            curl -fsSL -A subway-surf -o subwaydatanyc_${day}_csv.tar.xz "https://subwaydata.nyc/data/subwaydatanyc_${day}_csv.tar.xz" \
              || curl -fsSL -A subway-surf -o subwaydatanyc_${day}_csv.tar.xz "https://data.subwaydata.nyc/subwaydatanyc_${day}_csv.tar.xz"
          done
          ls -la
          git init -q -b data-sample && git add . 
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "sample days"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-sample
